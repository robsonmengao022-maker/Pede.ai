name: Gerar APK do Pedeaí Entregador
on:
  push:
    branches: [main]
    paths: ['android-entregador/**', '.github/workflows/android-entregador.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Compilar APK
        working-directory: android-entregador
        run: gradle assembleDebug --no-daemon
      - name: Publicar APK na página de releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: entregador-${{ github.run_number }}
          name: Pedeaí Entregador build ${{ github.run_number }}
          files: android-entregador/app/build/outputs/apk/debug/app-debug.apk
