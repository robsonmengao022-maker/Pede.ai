<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cardápio</title>
<style>
:root{--brand:#ff4d2e;--ink:#1d1b1a;--mute:#6f6a66;--line:#ece7e3;--bg:#faf7f5;--card:#fff}
*{box-sizing:border-box}body{margin:0;font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink);background:var(--bg);padding-bottom:150px}
header{background:var(--card);padding:20px 16px 14px;border-bottom:1px solid var(--line)}
header h1{margin:0 0 4px;font-size:22px}header p{margin:0;color:var(--mute);font-size:14px}
.badge{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600;margin-top:8px}
.open{background:#e3f7e8;color:#157a35}.closed{background:#fde8e6;color:#b3261e}
nav{position:sticky;top:0;background:var(--card);border-bottom:1px solid var(--line);display:flex;gap:8px;overflow-x:auto;padding:10px 16px;z-index:5}
nav a{white-space:nowrap;padding:6px 14px;border-radius:99px;background:var(--bg);color:var(--ink);text-decoration:none;font-size:14px;border:1px solid var(--line)}
main{max-width:720px;margin:0 auto;padding:8px 16px}
h2{font-size:18px;margin:22px 0 10px}
.item{display:flex;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.item img{width:84px;height:84px;object-fit:cover;border-radius:10px;flex:none}
.item .t{flex:1;min-width:0}.item b{display:block}.item small{color:var(--mute);display:block;margin:2px 0 6px}
.price{font-weight:700}
.add,.btn{background:var(--brand);color:#fff;border:0;border-radius:10px;padding:10px 16px;font:600 15px inherit;cursor:pointer}
.add{padding:6px 14px}.btn[disabled]{opacity:.5}
.btn.ghost{background:var(--bg);color:var(--ink);border:1px solid var(--line)}
.step{display:inline-flex;align-items:center;gap:10px}.step button{width:30px;height:30px;border-radius:99px;border:1px solid var(--line);background:#fff;font-size:18px;cursor:pointer}
#bar{position:fixed;left:0;right:0;bottom:64px;padding:12px 16px;background:linear-gradient(transparent,var(--bg) 30%)}
#bar .btn{width:100%;max-width:720px;display:flex;justify-content:space-between;margin:0 auto}
dialog{border:0;border-radius:18px;padding:0;width:min(520px,94vw);max-height:92vh;color:var(--ink)}
dialog::backdrop{background:#0008}
.pad{padding:18px}.pad h3{margin:0 0 10px}
label{display:block;font-size:13px;color:var(--mute);margin:10px 0 4px}
input,select,textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;font:inherit;background:#fff}
.seg{display:flex;gap:8px}.seg label{flex:1;margin:0;color:var(--ink)}.seg input{display:none}
.seg span{display:block;text-align:center;padding:10px;border:1px solid var(--line);border-radius:10px;cursor:pointer}
.seg input:checked+span{border-color:var(--brand);background:#fff1ee;font-weight:600}
.row{display:flex;justify-content:space-between;margin:4px 0}.tot{font-size:18px;font-weight:700;border-top:1px dashed var(--line);padding-top:8px;margin-top:8px}
.err{color:#b3261e;font-size:14px;margin-top:8px;min-height:18px}
.cartline{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.pix{word-break:break-all;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;font:12px monospace;margin:8px 0}
.st{display:flex;gap:6px;margin:12px 0;flex-wrap:wrap}.st span{padding:4px 10px;border-radius:99px;background:var(--bg);font-size:13px;color:var(--mute)}.st .on{background:var(--brand);color:#fff;font-weight:600}
.tabs{position:fixed;left:0;right:0;top:auto;bottom:0;display:flex;background:#6b3a8f;z-index:6;padding-bottom:env(safe-area-inset-bottom)}
.tabs button{flex:1;background:none;border:0;color:#d9c7e8;padding:8px 0 10px;font:12px system-ui,-apple-system,sans-serif;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
.tabs button.on{color:#fff;font-weight:700}
.tabs svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#v_pedidos,#v_aval,#v_perfil{padding:16px}
#v_pedidos h2,#v_aval h2,#v_perfil h2{margin:4px 0 10px}
.foot{text-align:center;color:var(--mute);font-size:12px;margin:30px 0}
.muted{color:var(--mute);font-size:14px}
</style>
</head>
<body>
<header id="hd"></header>
<nav id="cats"></nav>
<main id="menu"></main>
<section id="v_pedidos" hidden></section>
<section id="v_aval" hidden></section>
<section id="v_perfil" hidden></section>
<div class="foot">Feito com Pedeaí</div>
<div id="bar" hidden><button class="btn" id="cartBtn"><span id="cartN"></span><span id="cartT"></span></button></div>
<nav class="tabs" id="tabs">
<button data-v="cardapio" class="on"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Cardápio</button>
<button data-v="pedidos"><svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h4"/></svg>Pedidos</button>
<button data-v="aval"><svg viewBox="0 0 24 24"><path d="M12 3l2.8 5.7 6.2.9-4.5 4.4 1 6.2L12 17.3 6.5 20.2l1-6.2-4.5-4.4 6.2-.9z"/></svg>Avaliações</button>
<button data-v="perfil"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg>Perfil</button>
</nav>
<dialog id="dlg"></dialog>

<script src="/loja.js"></script>
</body>
</html>
