<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Admin — Pedeaí</title>
<style>
body{margin:0;font:16px/1.4 system-ui,sans-serif;background:#faf7f5;color:#1d1b1a}.w{max-width:900px;margin:0 auto;padding:16px}
input,button{font:inherit;padding:10px;border-radius:10px;border:1px solid #ece7e3}button{background:#ff4d2e;color:#fff;border:0;font-weight:600;cursor:pointer}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden;margin-top:12px}th,td{padding:10px;text-align:left;border-bottom:1px solid #ece7e3;font-size:14px}th{background:#f3eeea}
.n{text-align:right}.k{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px}.k div{background:#fff;border:1px solid #ece7e3;border-radius:12px;padding:12px 16px}.k b{display:block;font-size:22px}
</style>
</head>
<body><div class="w">
<h1>Admin da Pedeaí</h1>
<div><input id="pw" type="password" placeholder="Senha de administrador"> <button id="go">Entrar</button> <span id="err" style="color:#b3261e"></span></div>
<div id="out"></div>
</div>
<script>
const brl = n => 'R$ ' + Number(n).toFixed(2).replace('.', ',');
const cell = (t, cls) => { const e = document.createElement('td'); e.textContent = t; if (cls) e.className = cls; return e; };
document.getElementById('go').onclick = async () => {
  const err = document.getElementById('err'); err.textContent = '';
  const r = await fetch('/api/admin/stores', { headers: { 'x-admin-password': document.getElementById('pw').value } });
  const j = await r.json();
  if (!r.ok) { err.textContent = j.error; return; }
  const out = document.getElementById('out'); out.replaceChildren();
  const k = document.createElement('div'); k.className = 'k';
  [['Lojas', j.stores.length], ['Mensalidades do mês ' + j.month, brl(j.total_fees)]].forEach(([a, b]) => { const d = document.createElement('div'); d.append(a); const s = document.createElement('b'); s.textContent = b; d.append(s); k.append(d); });
  const t = document.createElement('table'), hd = t.createTHead().insertRow();
  ['Loja', 'Endereço do site', 'E-mail', 'WhatsApp', 'Pedidos', 'Vendas no mês', 'Mensalidade'].forEach(x => { const th = document.createElement('th'); th.textContent = x; hd.append(th); });
  const tb = t.createTBody();
  j.stores.forEach(s => { const tr = tb.insertRow(); tr.append(cell(s.name), cell('/' + s.slug), cell(s.email), cell(s.whatsapp), cell(s.orders, 'n'), cell(brl(s.revenue), 'n'), cell(brl(s.fee), 'n')); });
  out.append(k, t);
};
</script>
</body>
</html>
